        }

        }
        h2 { margin: 0 0 18px; color: #2c3e50; text-align: center; font-size: clamp(19px, 4vw, 26px); }
        .search-box { width:100%; padding:12px 14px; font-size:16px; border:2px solid #3498db; border-radius:8px; margin-bottom:12px; outline:none; }

        .top-buttons { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
        .auth-box { background:#fdfefe; padding:10px; border-radius:8px; border:1px dashed #3498db; display:flex; align-items:center; gap:8px; font-size:14px; width:100%; }
        .auth-box span { white-space:nowrap; }
        .auth-box input { padding:8px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:0; width:0; }
        .auth-box button { padding:8px 12px; background:#3498db; color:white; border:0; border-radius:4px; cursor:pointer; font-weight:bold; white-space:nowrap; }
        .github-download-btn { background:#00897b; color:white; border:0; padding:12px 14px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px; width:100%; }
        .github-download-btn:hover { background:#00695c; }
        .add-form-box { background:#f9f9f9; padding:12px; border-radius:8px; margin-bottom:14px; border:1px solid #ddd; display:none; }
        .add-form-box h3 { margin:0 0 10px; font-size:16px; color:#333; }
        .form-inputs { display:flex; gap:8px; flex-wrap:wrap; }
        .form-inputs input { padding:10px; border:1px solid #ccc; border-radius:4px; font-size:14px; min-width:0; }
        .form-inputs button { padding:10px 16px; background:#27ae60; color:white; border:0; border-radius:4px; cursor:pointer; font-weight:bold; font-size:14px; }
        .info-bar { display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:14px; color:#666; font-weight:bold; }
        .table-responsive { width:100%; max-height:65vh; overflow:auto; border:1px solid #e1e8ed; border-radius:8px; -webkit-overflow-scrolling:touch; }
        table { width:100%; min-width:0; table-layout:fixed; border-collapse:collapse; background:#fff; text-align:left; }
        th { background:#3498db; color:white; padding:12px 10px; position:sticky; top:0; z-index:10; font-weight:600; overflow-wrap:normal; }
        th:nth-child(1), td:nth-child(1) { width:30%; }
        th:nth-child(2), td:nth-child(2) { width:18%; text-align:center; }
        th:nth-child(3), td:nth-child(3) { width:52%; }
        td { padding:12px 10px; border-bottom:1px solid #f1f1f1; font-size:15px; vertical-align:middle; overflow-wrap:anywhere; }
        td:first-child { white-space:nowrap; overflow-wrap:normal; }
        tr:hover { background:#f1f9fc; }
        .no-result { text-align:center; padding:24px; color:#999; font-size:16px; }
        @media (max-width: 480px) {
            body { padding:2px; }
            .container { padding:8px 4px; border-radius:6px; }
            h2 { font-size:19px; margin-bottom:14px; }
            .info-bar { font-size:13px; }
            th { padding:10px 6px; font-size:13px; }
            td { padding:10px 6px; font-size:14px; }
            th:nth-child(1), td:nth-child(1) { width:27%; }
            th:nth-child(2), td:nth-child(2) { width:18%; }
            th:nth-child(3), td:nth-child(3) { width:55%; }
            td:first-child { white-space:nowrap; word-break:keep-all; font-size:14px; }
            th { padding:9px 4px; font-size:12px; }
            td { padding:9px 4px; font-size:13px; }
        }

            body { padding:20px; }
            .container { padding:24px; }
            .top-buttons { flex-direction:row; align-items:center; }

<div class="container">

    <input type="text" id="searchInput" class="search-box" placeholder="이름을 입력하세요 (예: 김명숙, 1독)..." oninput="filterTable()">
    
    <div class="top-buttons">
        <div class="auth-box" id="authBox">

        </div>
        <button class="github-download-btn" onclick="checkAuthAndExecute(downloadGithubData)">⬇️ bible_data.json 백업 다운로드</button>
    </div>

    <div class="add-form-box" id="addFormBox">
        <h3>➕ 새로운 통독 기록 추가</h3>

            <input type="text" id="newName" placeholder="이름 (예: 김명숙)" style="flex: 1; min-width: 110px;">
            <input type="text" id="newRound" placeholder="회차 (예: 9독)" style="flex: 1; min-width: 130px;">
            <input type="text" id="newDetail" placeholder="기록 (예: '26.01.01 ~ '26.05.30)" style="flex: 2; min-width: 180px;">
            <button onclick="addNewRecord()">추가하기</button>
        </div>
    </div>

    <div class="info-bar">
        <span id="resultCount">전체 항목: 0개</span>
        <span>💡 이름을 검색하거나 전체 목록을 확인하세요.</span>
    </div>

         console.error("브라우저 저장 실패:", error);
         alert("브라우저에 저장하지 못했습니다. 기기의 저장 공간 또는 브라우저 설정을 확인해주세요.");
         return false;
     }
 }

 async function loadInitialData() {
     // GitHub에 게시된 bible_data.json을 우선 불러옵니다.
     // 네트워크 오류가 있을 때만 HTML 내장 데이터로 대체합니다.
     let sourceData = defaultData.slice();
     try {
         const response = await fetch("https://raw.githubusercontent.com/jjkl2040-svg/unsan2/main/bible_data.json", { cache: "no-store" });
         if (!response.ok) throw new Error("GitHub 데이터 응답 오류: " + response.status);
         const githubData = await response.json();
         if (!Array.isArray(githubData)) throw new Error("GitHub 데이터 형식이 배열이 아닙니다.");
         sourceData = githubData.filter(item => item && typeof item.name === "string" && typeof item.round === "string" && typeof item.detail === "string");
     } catch (error) {
         console.error("GitHub 원본 데이터를 불러오지 못했습니다. 내장 데이터를 사용합니다.", error);
     }

     // 브라우저에 저장된 추가 기록은 원본 데이터에 없는 항목만 합칩니다.
     try {
         const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
         if (saved !== null) {
             const parsed = JSON.parse(saved);
             if (Array.isArray(parsed)) {
                 const seen = new Set(sourceData.map(item => JSON.stringify([item.name, item.round, item.detail])));
                 parsed.forEach(item => {
                     if (!item || typeof item.name !== "string" || typeof item.round !== "string" || typeof item.detail !== "string") return;
                     const key = JSON.stringify([item.name, item.round, item.detail]);
                     if (!seen.has(key)) { sourceData.push(item); seen.add(key); }
                 });
             }
         }
     } catch (error) {
         console.error("브라우저 저장 기록을 읽지 못했습니다:", error);
     }
     defaultData = sourceData;
     saveLocalData();
     renderTable(defaultData);
 }

 loadInitialData();

 function checkPassword() {
     const pwInput = document.getElementById("accessPassword").value;
     if (pwInput === ADMIN_PASSWORD) {
         isAdmin = true;
         document.getElementById("authBox").innerHTML = "<span style='color:#27ae60; font-weight:bold;'>🔓 관리자 인증 완료</span>";
         document.getElementById("addFormBox").style.display = "block";
         alert("관리자 권한이 확인되었습니다.");
     } else {
         alert("비밀번호가 틀렸습니다.");
         document.getElementById("accessPassword").value = "";
     }
 }

 function checkAuthAndExecute(callback) {
     if (!isAdmin) {
         const pw = prompt("관리자 비밀번호를 입력하세요:");
         if (pw === ADMIN_PASSWORD) {
             isAdmin = true;
             document.getElementById("authBox").innerHTML = "<span style='color:#27ae60; font-weight:bold;'>🔓 관리자 인증 완료</span>";
             document.getElementById("addFormBox").style.display = "block";
             callback();
         } else if (pw !== null) {
             alert("비밀번호가 틀렸습니다.");
         }
     } else {
         callback();
     }
 }

 function downloadGithubData() {
     const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(defaultData, null, 2));
     const downloadAnchor = document.createElement('a');
     downloadAnchor.setAttribute("href", dataStr);
     downloadAnchor.setAttribute("download", "bible_data.json");
     document.body.appendChild(downloadAnchor);
     downloadAnchor.click();
     downloadAnchor.remove();
 }

 function addNewRecord() {
     const name = document.getElementById("newName").value.trim();
     const round = document.getElementById("newRound").value.trim();
     const detail = document.getElementById("newDetail").value.trim();

     if (!name || !round || !detail) {
         alert("모든 항목을 입력해주세요.");
         return;
     }

     const newRecord = { name, round, detail };
     defaultData.unshift(newRecord);
     // 추가 즉시 브라우저에 저장하여 새로고침 후에도 유지합니다.
     if (!saveLocalData()) {
         defaultData.shift();
         return;
     }
     renderTable(defaultData);

     document.getElementById("newName").value = "";
     document.getElementById("newRound").value = "";
     document.getElementById("newDetail").value = "";
     alert("새로운 기록이 추가되었습니다.");
 }

 function renderTable(data) {
     const tbody = document.getElementById("tableBody");
     tbody.innerHTML = "";
     document.getElementById("resultCount").innerText = "전체 항목: " + data.length + "개";
     
     if(data.length === 0) {
         tbody.innerHTML = "<tr><td colspan='3' class='no-result'>검색 결과가 없습니다.</td></tr>";
         return;
     }

     data.forEach(item => {
         const tr = document.createElement("tr");
         tr.innerHTML = `<td>${item.name}</td><td>${item.round}</td><td>${item.detail}</td>`;
         tbody.appendChild(tr);
     });
 }

 function filterTable() {
     const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
     if (searchTerm === "") {
         renderTable(defaultData);
         return;
     }

     const filtered = defaultData.filter(item => {
         const fullText = (item.name + " " + item.round + " " + item.detail).toLowerCase();
         return fullText.includes(searchTerm);
     });

     renderTable(filtered);
 }
</script>
